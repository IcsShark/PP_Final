<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Delta-stepping 逐步演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: graph canvas left, bucket/relax log rail right; stacks on phones. Blues are reserved for bucket state, green for relaxation. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b2230; --muted:#667085; --line:#c9d0db;
  --node:#ffffff; --node-stroke:#8a94a6; --edge:#b8c0cc; --relax:#16a34a; --relax-soft:#dcfce7;
  --ring:#f59e0b;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --fg:#e6e9ef; --muted:#98a2b3; --line:#323b48;
  --node:#232b36; --node-stroke:#7b8596; --edge:#46505e; --relax:#22c55e; --relax-soft:#173a25; --ring:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --fg:#e6e9ef; --muted:#98a2b3; --line:#323b48;
  --node:#232b36; --node-stroke:#7b8596; --edge:#46505e; --relax:#22c55e; --relax-soft:#173a25; --ring:#fbbf24; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
h1{font-size:1.35rem;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--node-stroke)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.counter{min-width:7ch}
input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--relax)}
.ctl-group{display:flex;align-items:center;gap:6px}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.panel h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
svg{display:block;width:100%;height:auto}
.msg{font-weight:500;margin-bottom:6px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.log li{padding:4px 8px;border-radius:6px;background:var(--bg)}
.log li.upd{background:var(--relax-soft)}
.buckets{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:4px 6px;border-radius:6px}
.brow.cur{outline:2px solid var(--ring)}
.blabel{display:flex;align-items:center;gap:6px;font-size:.85rem;min-width:9.5em}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.chip{font-family:var(--font-mono);font-size:.8rem;padding:1px 7px;border-radius:5px;border:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.grad{width:70px;height:12px;border-radius:3px}
.dtable{width:100%;border-collapse:collapse;font-size:.85rem}
.dtable td,.dtable th{padding:3px 4px;text-align:center;border-bottom:1px solid var(--line)}
.dtable th{color:var(--muted);font-weight:500}
.dtable td.chg{color:var(--relax);font-weight:700}
.tablewrap{overflow-x:auto}
.node circle{transition:fill .25s,stroke .25s}
.edge line{transition:stroke .2s,stroke-width .2s}
@media (prefers-reduced-motion:reduce){.node circle,.edge line{transition:none}}
kbd{font-family:var(--font-mono);font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>

<div class="wrap">
  <header>
    <h1>Delta-stepping 逐步演示</h1>
    <span class="sub">source = A，無向圖。每次 relax 一個點 u 的所有鄰居（不分 light / heavy）。<kbd>←</kbd><kbd>→</kbd> 可切換。</span>
  </header>

  <div class="controls">
    <button id="prev" type="button">← 上一步</button>
    <button id="next" type="button">下一步 →</button>
    <span class="counter mono" id="counter"></span>
    <input id="scrub" type="range" min="0" value="0" aria-label="步驟">
    <div class="ctl-group">
      <label for="delta">Δ =</label>
      <select id="delta"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
    </div>
    <button id="reset" type="button">重設</button>
  </div>

  <div class="main">
    <div class="panel">
      <svg id="g" viewBox="0 0 720 450" role="img" aria-label="圖與目前狀態"></svg>
      <div class="legend">
        <span><span class="sw" style="background:var(--node);border-color:var(--node-stroke)"></span>不在 bucket</span>
        <span>bucket：<span class="grad" id="grad"></span><span id="gradlabel" class="mono"></span></span>
        <span><svg width="26" height="10" style="width:26px"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--relax)" stroke-width="3.5"/></svg>relax 中的邊</span>
        <span><svg width="16" height="16" style="width:16px"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--ring)" stroke-width="2.5"/></svg>目前的 u</span>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <h2>這一步</h2>
        <div class="msg" id="msg"></div>
        <ul class="log" id="log"></ul>
      </div>
      <div class="panel">
        <h2>Buckets（B<sub>i</sub> 存 ⌊d/Δ⌋ = i 的點）</h2>
        <div class="buckets" id="buckets"></div>
      </div>
      <div class="panel">
        <h2>距離 d</h2>
        <div class="tablewrap"><table class="dtable" id="dtable"></table></div>
      </div>
    </div>
  </div>
</div>

<script>
const N = ["A","B","C","D","E","F","G","H","I","J"];
const POS = [[70,225],[190,85],[225,240],[150,370],[365,105],[375,280],[320,400],[515,175],[520,365],[655,265]];
const E = [["A","B",2],["A","C",5],["A","D",1],["D","C",1],["B","E",4],["C","F",3],["D","G",6],["E","H",2],
           ["F","H",1],["F","I",4],["G","I",2],["H","J",3],["I","J",1],["C","E",2],["G","F",2]];
const idx = Object.fromEntries(N.map((n,i)=>[n,i]));
const edges = E.map(([a,b,w])=>({a:idx[a],b:idx[b],w}));
const adj = N.map(()=>[]);
edges.forEach((e,k)=>{adj[e.a].push({v:e.b,w:e.w,k});adj[e.b].push({v:e.a,w:e.w,k});});
const SRC = 0;

function simulate(D){
  const n=N.length, dist=Array(n).fill(Infinity), bk=Array(n).fill(-1);
  const steps=[];
  const snap=(o)=>steps.push({dist:dist.slice(),bk:bk.slice(),u:-1,active:[],frontier:[],cur:-1,log:[],changed:[],...o});
  dist[SRC]=0; bk[SRC]=0;
  snap({msg:`初始化：d(A)=0，A 放入 B0；其餘點 d=∞。`});
  let lastI=-1, round=0;
  while(true){
    const live=bk.filter(b=>b>=0);
    if(!live.length) break;
    const i=Math.min(...live);
    round = (i===lastI)? round+1 : 1; lastI=i;
    const R=[]; bk.forEach((b,v)=>{if(b===i)R.push(v)});
    snap({cur:i,frontier:R,msg:`取出 B${i}（第 ${round} 輪）：{ ${R.map(v=>N[v]).join(", ")} } 要被 relax。${round>1?"這些點是上一輪被更新後又落回 B"+i+" 的。":""}`});
    R.forEach((u,j)=>{
      bk[u]=-1;
      const log=[], active=[], changed=[];
      for(const {v,w,k} of adj[u]){
        active.push(k);
        const nd=dist[u]+w, old=dist[v];
        if(nd<old){
          const ob=bk[v], nb=Math.floor(nd/D);
          dist[v]=nd; bk[v]=nb; changed.push(v);
          const mv = ob<0 ? `放入 B${nb}` : (ob===nb ? `留在 B${nb}` : `B${ob} → B${nb}`);
          log.push({t:`${N[u]}→${N[v]}：${dist[u]}+${w}=${nd} < ${old===Infinity?"∞":old}，更新，${mv}`,upd:true});
        } else {
          log.push({t:`${N[u]}→${N[v]}：${dist[u]}+${w}=${nd} ≥ ${old}，不變`,upd:false});
        }
      }
      const rest=R.slice(j+1).filter(v=>bk[v]===i);
      snap({u,cur:i,active,frontier:rest,log,changed,
        msg:`B${i} 第 ${round} 輪：relax u=${N[u]}（d=${dist[u]}）的所有鄰居。${N[u]} 移出 bucket。`});
    });
  }
  snap({msg:`所有 bucket 皆空，演算法結束。d 即為從 A 出發的最短距離。`,done:true});
  return steps;
}

const svg=document.getElementById("g"), NS="http://www.w3.org/2000/svg";
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const edgeEls=edges.map(e=>{
  const [x1,y1]=POS[e.a],[x2,y2]=POS[e.b];
  const g=mk("g",{class:"edge"});
  const line=mk("line",{x1,y1,x2,y2,stroke:"var(--edge)","stroke-width":2,"stroke-linecap":"round"},g);
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  mk("rect",{x:mx-11,y:my-10,width:22,height:20,rx:5,fill:"var(--surface)",stroke:"var(--line)"},g);
  const t=mk("text",{x:mx,y:my+4.5,"text-anchor":"middle","font-size":13,"font-family":"var(--font-mono)",fill:"var(--muted)"},g);
  t.textContent=e.w;
  return {line,t};
});
const nodeEls=N.map((name,i)=>{
  const [x,y]=POS[i];
  const g=mk("g",{class:"node"});
  const ring=mk("circle",{cx:x,cy:y,r:30,fill:"none",stroke:"var(--ring)","stroke-width":3.5,opacity:0},g);
  const c=mk("circle",{cx:x,cy:y,r:22,fill:"var(--node)",stroke:"var(--node-stroke)","stroke-width":2},g);
  const t=mk("text",{x,y:y+5.5,"text-anchor":"middle","font-size":17,"font-weight":700,"font-family":"var(--font-body)"},g);
  t.textContent=name;
  const d=mk("text",{x,y:y+(y>380?-36:44),"text-anchor":"middle","font-size":13.5,"font-family":"var(--font-mono)",fill:"var(--muted)"},g);
  return {ring,c,t,d};
});

let D=3, steps=[], cur=0, maxB=1;
const shade=(b)=>{ // b=0 darkest, b=maxB lightest
  const f = maxB===0?0:b/maxB;
  const L = 30 + f*56, S = 78 - f*8;
  return {fill:`hsl(214 ${S}% ${L}%)`, text: L<58?"#fff":"#0f1f3a", stroke:`hsl(214 ${S}% ${Math.max(L-14,18)}%)`};
};

function rebuild(){
  steps=simulate(D);
  const fin=steps[steps.length-1].dist;
  maxB=Math.max(...fin.filter(x=>x<Infinity).map(x=>Math.floor(x/D)));
  const scrub=document.getElementById("scrub"); scrub.max=steps.length-1;
  document.getElementById("grad").style.background=`linear-gradient(90deg, ${shade(maxB).fill}, ${shade(0).fill})`;
  document.getElementById("gradlabel").textContent=`B${maxB} … B0`;
  cur=0; render();
}

function render(){
  const s=steps[cur];
  edgeEls.forEach((e,k)=>{
    const on=s.active.includes(k);
    e.line.setAttribute("stroke",on?"var(--relax)":"var(--edge)");
    e.line.setAttribute("stroke-width",on?5:2);
    e.t.setAttribute("fill",on?"var(--relax)":"var(--muted)");
    e.t.setAttribute("font-weight",on?700:400);
  });
  nodeEls.forEach((n,i)=>{
    const b=s.bk[i];
    if(b>=0){const sh=shade(b);n.c.setAttribute("fill",sh.fill);n.c.setAttribute("stroke",sh.stroke);n.t.setAttribute("fill",sh.text);}
    else{n.c.setAttribute("fill","var(--node)");n.c.setAttribute("stroke","var(--node-stroke)");n.t.setAttribute("fill","var(--fg)");}
    n.ring.setAttribute("opacity",i===s.u?1:0);
    const dv=s.dist[i];
    n.d.textContent=dv===Infinity?"∞":"d="+dv;
    n.d.setAttribute("fill",s.changed.includes(i)?"var(--relax)":(dv===Infinity?"var(--muted)":"var(--fg)"));
    n.d.setAttribute("font-weight",s.changed.includes(i)?700:400);
  });
  document.getElementById("msg").textContent=s.msg;
  const log=document.getElementById("log"); log.innerHTML="";
  if(s.frontier.length && s.u>=0){const li=document.createElement("li");li.textContent=`B${s.cur} 中這一輪還沒處理：${s.frontier.map(v=>N[v]).join(", ")}`;log.appendChild(li);}
  s.log.forEach(l=>{const li=document.createElement("li");li.className="mono"+(l.upd?" upd":"");li.textContent=l.t;log.prepend?log.appendChild(li):0;});
  if(!log.children.length){const li=document.createElement("li");li.textContent=s.done?"完成。":(s.u<0&&s.cur<0?"按「下一步」開始。":"這一步只是選出 bucket，下一步開始 relax。");log.appendChild(li);}
  const bw=document.getElementById("buckets"); bw.innerHTML="";
  for(let b=0;b<=maxB;b++){
    const row=document.createElement("div"); row.className="brow"+(b===s.cur?" cur":"");
    const sh=shade(b);
    row.innerHTML=`<div class="blabel"><span class="sw" style="background:${sh.fill};border-color:${sh.stroke}"></span><span class="mono">B${b}</span><span class="sub mono">[${b*D}, ${(b+1)*D})</span></div>`;
    const chips=document.createElement("div"); chips.className="chips";
    s.bk.forEach((bb,v)=>{if(bb===b){const c=document.createElement("span");c.className="chip";c.style.background=sh.fill;c.style.color=sh.text;c.style.borderColor=sh.stroke;c.textContent=N[v];chips.appendChild(c);}});
    row.appendChild(chips); bw.appendChild(row);
  }
  const tb=document.getElementById("dtable");
  tb.innerHTML=`<tr><th></th>${N.map(n=>`<th>${n}</th>`).join("")}</tr><tr><th>d</th>${s.dist.map((d,i)=>`<td class="mono${s.changed.includes(i)?" chg":""}">${d===Infinity?"∞":d}</td>`).join("")}</tr>`;
  document.getElementById("counter").textContent=`${cur} / ${steps.length-1}`;
  document.getElementById("scrub").value=cur;
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===steps.length-1;
}
const go=(k)=>{cur=Math.max(0,Math.min(steps.length-1,k));render();};
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("reset").onclick=()=>go(0);
document.getElementById("scrub").oninput=(e)=>go(+e.target.value);
document.getElementById("delta").onchange=(e)=>{D=+e.target.value;rebuild();};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"){go(cur+1);e.preventDefault();}
  if(e.key==="ArrowLeft"){go(cur-1);e.preventDefault();}
});
rebuild();
</script>

</body></html>
